[project]
name = "deribit-tracker"
version = "0.1.0"
description = ""
authors = [
    {name = "nock",email = "ladrek13@mail.ru"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard] (>=0.143.0,<0.144.0)",
    "structlog (>=26.1.0,<27.0.0)",
    "sqlalchemy (>=2.1.4,<3.0.0)",
    "python-jose (>=3.5.0,<4.0.0)",
    "passlib (>=1.7.4,<2.0.0)",
    "alembic (>=1.20.0,<2.0.0)",
    "greenlet (>=3.5.6,<4.0.0)",
    "asyncpg (>=0.32.0,<0.33.0)",
    "argon2-cffi (>=25.1.0,<26.0.0)",
    "pytest (>=9.1.1,<10.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "pytest-asyncio (>=1.4.0,<2.0.0)",
    "faker (>=40.43.0,<41.0.0)",
    "aiosqlite (>=0.22.1,<0.23.0)",
    "aiohttp (>=3.14.5,<4.0.0)",
    "celery (>=5.6.3,<6.0.0)",
    "fastapi-redis-sdk (>=0.8.1,<0.9.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function" 