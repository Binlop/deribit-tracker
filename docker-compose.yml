services:
  db:
    image: postgres:16
    env_file: .env.example
    restart: unless-stopped
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    image: deribit-app
    working_dir: /app/src
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    env_file: .env.example
    restart: unless-stopped
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: .
    image: deribit-app
    working_dir: /app/src
    command: celery -A core.celery.celery_app worker --loglevel=info
    env_file: .env.example
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  beat:
    build: .
    image: deribit-app
    working_dir: /app/src
    command: celery -A core.celery.celery_app beat --loglevel=info
    env_file: .env.example
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy

volumes:
  pgdata: